[project]
name = "hamlet"
version = "0.1.0"
description = "Internal states and emergent behaviour: a homeostatic multi-agent RL village (COM748)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pettingzoo>=1.24",
    "gymnasium>=0.29",
    "pytest>=8",
    "tabulate>=0.10.0",
    "codecarbon>=3.3.0",
]

[project.optional-dependencies]
rl = ["torch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hamlet"]
